<h1 mat-dialog-title>{{ title }}</h1>

<div mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="fill">
    <mat-label>Setting Name</mat-label>
    <input matInput formControlName="name" required>
    <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    <mat-error *ngIf="form.get('name')?.hasError('minlength')">Name must be at least 3 characters</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Logo URL</mat-label>
    <input matInput formControlName="logo" required>
    <mat-error *ngIf="form.get('logo')?.hasError('required')">Logo URL is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Primary Color</mat-label>
    <input matInput type="color" formControlName="color">
    <mat-hint align="end">{{ form.get('color')?.value }}</mat-hint>
    <mat-error *ngIf="form.get('color')?.hasError('pattern')">Must be a valid hex color (e.g., #RRGGBB)</mat-error>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="onSave()">
    {{ isEditMode? 'Save Changes' : 'Create' }}
  </button>
</div>
