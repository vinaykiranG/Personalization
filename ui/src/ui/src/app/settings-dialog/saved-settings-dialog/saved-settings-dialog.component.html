<style>
  .setting-logo {
    max-height: 40px;
    max-width: 100px;
  }
  .color-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    border: 1px solid #ccc;
  }
  .settings-container {
    padding: 24px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .status-applied {
    display: flex;
    align-items: center;
    gap: 4px;
    color: green;
  }
</style>

<div class="settings-container">
  <div class="header">
    <h1>Application Settings</h1>
    <button mat-raised-button color="primary" (click)="openSettingsDialog()">
      <mat-icon>add</mat-icon>
      New Setting
    </button>
  </div>

  <mat-table [dataSource]="settings$ | async" class="mat-elevation-z8">

    <ng-container matColumnDef="logo">
      <mat-header-cell *matHeaderCellDef> Logo </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <img [src]="element.logo" alt="Logo for {{element.name}}" class="setting-logo">
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="color">
      <mat-header-cell *matHeaderCellDef> Primary Color </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <div class="color-swatch" [style.backgroundColor]="element.color"></div>
        {{element.color}}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <span *ngIf="element.isApplied" class="status-applied">
          <mat-icon>check_circle</mat-icon> Applied
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-flat-button color="primary" [disabled]="element.isApplied" (click)="onApply(element.id)">
          Apply
        </button>
        <button mat-icon-button color="accent" (click)="openSettingsDialog(element)" matTooltip="Edit Setting">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(element.id)" matTooltip="Delete Setting">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
