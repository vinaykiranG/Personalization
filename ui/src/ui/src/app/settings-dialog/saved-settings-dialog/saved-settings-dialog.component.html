<div mat-dialog-content class="saved-settings-dialog-modal">
  <div class="dialog-header">
    <h2 class="dialog-title">Saved Settings</h2>
    <div class="new-settings-btn-container">
    <button mat-raised-button color="primary" class="new-settings-btn" (click)="createNewSetting()">
      <mat-icon [color]="'black'">add</mat-icon> New Settings
    </button>
  </div>
    <button mat-icon-button class="close-dialog-btn" (click)="closeDialog()" style="position:absolute;top:12px;right:12px;">
      <mat-icon style="color: black;">close</mat-icon>
    </button>
  </div>

  <mat-divider></mat-divider>

  <div class="filter-container">
    <mat-form-field appearance="outline">
      <mat-label>Search Settings</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search by brand name...">
    </mat-form-field>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading saved settings...</p>
  </div>

  <div *ngIf="!loading && dataSource.data.length === 0" class="no-data">
    <mat-icon [color]="'black'">settings</mat-icon>
    <p>No saved settings found.</p>
    <p class="hint">Create and save settings to see them here.</p>
  </div>

  <div *ngIf="!loading && dataSource.data.length > 0" class="settings-table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 settings-table">
      <!-- Logo Column -->
      <ng-container matColumnDef="logo">
        <th mat-header-cell *matHeaderCellDef> Logo </th>
        <td mat-cell *matCellDef="let setting">
          <img [src]="setting.logoUrl || 'https://services.google.com/fh/files/misc/vigenair_logo.png'"
               alt="Logo"
               class="logo-preview"
               style="width:20px;height:20px;"
               onerror="this.src='https://services.google.com/fh/files/misc/vigenair_logo.png'">
        </td>
      </ng-container>

      <!-- Brand Column -->
      <ng-container matColumnDef="brandName">
        <th mat-header-cell *matHeaderCellDef> Brand </th>
        <td mat-cell *matCellDef="let setting">{{ setting.brandName }}</td>
      </ng-container>

      <!-- Color Column -->
      <ng-container matColumnDef="primaryColor">
        <th mat-header-cell *matHeaderCellDef> Color </th>
        <td mat-cell *matCellDef="let setting">
          <div class="color-box" [style.backgroundColor]="setting.primaryColor"></div>
        </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let setting">{{ setting.description }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let setting; let i = index">
          <button mat-icon-button color="primary" (click)="editSetting(i)" matTooltip="Edit Setting">
            <mat-icon style="color: black;">edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSavedSetting(i)" matTooltip="Delete Setting">
            <mat-icon style="color: black;">delete</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="applySavedSetting(i)" matTooltip="Apply Setting">
            <mat-icon style="color: black;">check_circle</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['logo', 'brandName', 'primaryColor', 'description', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['logo', 'brandName', 'primaryColor', 'description', 'actions'];"></tr>
    </table>
  </div>
</div>
